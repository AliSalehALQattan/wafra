<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وفرة | Wafra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5efe2; --bg2:#efe6d3; --card:#fffcf5; --ink:#15261d; --ink2:#4b5a50; --muted:#7c857c;
  --line:#e2d8c3; --green:#1d5a3c; --green2:#2b7a52; --leaf:#86b85a; --mint:#e3efdc;
  --amber:#d9932a; --amberbg:#fbecd2; --tomato:#c9472d; --tomatobg:#f8dfd7; --sky:#e8f0ee;
  --r:18px; --shadow:0 1px 0 rgba(21,38,29,.04),0 10px 30px -18px rgba(21,38,29,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.obox{font-size:13.5px;background:var(--bg);border-radius:10px;padding:8px 10px;color:var(--ink2)}
.offers{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.orow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.orow.top{border-color:var(--amber);background:#fffaf0}
.orow .who{flex:1;min-width:0}
.orow .amt{text-align:left;white-space:nowrap}
.orow .amt b{font-size:18px;color:var(--green)}
.orow .btn{padding:8px 16px;font-size:14px}
.fl{padding:10px;display:flex;flex-direction:column;gap:8px}
.fl .mi{border:0;padding:0;background:transparent}

.btn.dlapp{padding:9px 16px;font-size:14.5px;border-radius:999px;white-space:nowrap;flex:none}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;display:inline-block}
.cr{width:1.35em;height:1.35em;vertical-align:-.3em;display:inline-block;flex:none}
.emo{background:#efe6d3;overflow:hidden}
.emo .scene{width:100%;height:100%;display:block}
.mi .emo{display:block}
.bigic{width:72px;height:72px;border-radius:50%;display:inline-grid;place-items:center;margin-bottom:6px}
.bigic .ic{width:38px;height:38px;vertical-align:0}
.verdict .big{width:46px;height:46px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.65);border-radius:50%}
.verdict .big .ic{width:28px;height:28px;vertical-align:0}
.verdict .big.sm{width:38px;height:38px}.verdict .big.sm .ic{width:22px;height:22px}
.sic,.aic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--mint);color:var(--green)}
.sic .ic,.aic .ic{width:24px;height:24px;vertical-align:0}
.dic{width:64px;height:64px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--mint);color:var(--green)}
.dic .ic{width:32px;height:32px;vertical-align:0}
.badge .ic{width:1em;height:1em;vertical-align:-.12em}
.fchips .cr{width:1.2em;height:1.2em}

html,body{margin:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;
  background-image:radial-gradient(circle at 12% -10%,rgba(134,184,90,.18),transparent 40%),radial-gradient(circle at 100% 0%,rgba(217,147,42,.12),transparent 35%);
  background-attachment:fixed;min-height:100vh}
h1,h2,h3,h4{font-family:"Readex Pro","IBM Plex Sans Arabic",sans-serif;line-height:1.25;margin:0}
a{color:inherit}
button,input,select{font:inherit}
.container{max-width:1180px;margin:0 auto;padding:0 20px}
.num{font-family:"Readex Pro",sans-serif;font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:0;z-index:20;background:rgba(245,239,226,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:22px;height:66px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand b{font-family:"Readex Pro";font-size:24px;font-weight:700;color:var(--green)}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.5px;margin-top:-4px}
nav.main{display:flex;gap:4px;flex:1}
nav.main a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--ink2);font-weight:500;font-size:15px;white-space:nowrap}
nav.main a:hover{background:var(--bg2)}
nav.main a.on{background:var(--green);color:#fff}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb}
.dot.live{background:#2fa463;box-shadow:0 0 0 4px rgba(47,164,99,.18);animation:pulse 2s infinite}
.dot.demo{background:var(--amber)}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(47,164,99,.05)}}

/* common */
main{padding:28px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;text-decoration:none;font-size:15px;transition:transform .12s,background .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:#174a31}
.btn-amber{background:var(--amber);color:#2a1a02}
.btn-amber:hover{background:#c8841f}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--bg2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-lg{padding:14px 24px;font-size:16.5px;border-radius:14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px}
.b-cosmetic{background:var(--amberbg);color:#8a5410}
.b-fresh{background:var(--mint);color:var(--green)}
.b-spoiled{background:var(--tomatobg);color:var(--tomato)}
.b-sold{background:#e6e3dc;color:#5b5a55}
.b-live{background:#dff1e6;color:#1d6b43}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:13px;font-weight:600;color:var(--green2);letter-spacing:.3px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 0 16px}
.sec-h h2{font-size:24px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.inp,select.inp{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:none}
.inp:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(43,122,82,.15)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.empty{padding:40px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}

/* home */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center;padding:20px 0 34px}
.hero h1{font-size:clamp(32px,4.6vw,54px);font-weight:700;letter-spacing:-.5px}
.hero h1 em{font-style:normal;color:var(--green2);background:linear-gradient(transparent 62%,rgba(134,184,90,.35) 0)}
.hero p.lead{font-size:18px;color:var(--ink2);max-width:560px;margin:18px 0 26px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero-art{position:relative;aspect-ratio:1/1;max-width:420px;justify-self:center;width:100%}
.hero-art .frame{position:absolute;inset:6% 4% 14% 8%;border-radius:26px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(21,38,29,.5);transform:rotate(-3deg);border:6px solid #fff}
.hero-art .frame img{width:100%;height:100%;object-fit:cover;display:block}
.hero-art .chip{position:absolute;background:#fff;border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);border:1px solid var(--line);font-size:13.5px}
.hero-art .c1{top:2%;left:0}
.hero-art .c2{bottom:4%;right:0}
.hero-art .c3{bottom:26%;left:-4%}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{padding:18px 20px}
.kpi .v{font-family:"Readex Pro";font-size:28px;font-weight:700;color:var(--green)}
.kpi .l{font-size:13px;color:var(--ink2)}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:4px}
.problem{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.stat .v{font-family:"Readex Pro";font-size:34px;font-weight:700;color:var(--tomato)}
.stat .src{font-size:11.5px;color:var(--muted);margin-top:8px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:s}
.step{padding:20px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:16px;left:18px;font-family:"Readex Pro";font-size:40px;font-weight:700;color:var(--bg2)}
.step h3{font-size:17px;margin:10px 0 6px}
.step p{margin:0;font-size:14px;color:var(--ink2)}
.aud{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.aud .card{padding:18px}
.aud h4{font-size:16px;margin:8px 0 4px}
.aud p{margin:0;font-size:13.5px;color:var(--ink2)}
.v2030{background:var(--green);color:#eaf3ea;border-radius:22px;padding:28px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center}
.v2030 h2{color:#fff;font-size:26px}
.v2030 ul{margin:0;padding:0 18px 0 0}
.v2030 li{margin:6px 0}
section.block{margin-top:46px}

/* listing cards */
.lc{overflow:hidden;display:flex;flex-direction:column}
.lc .ph{text-decoration:none;display:block;position:relative;aspect-ratio:4/3;background:var(--bg2)}
.lc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.lc .ph .tl{position:absolute;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}
.lc .ph .disc{position:absolute;bottom:10px;left:10px;background:var(--ink);color:#fff;font-family:"Readex Pro";font-weight:700;padding:5px 10px;border-radius:10px;font-size:14px}
.lc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.lc h3{font-size:18px}
.lc .meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.price{display:flex;align-items:baseline;gap:8px}
.price .now{font-family:"Readex Pro";font-size:26px;font-weight:700;color:var(--green)}
.price .was{text-decoration:line-through;color:var(--muted);font-size:14px}
.bar{height:7px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--leaf));border-radius:99px}
.cd{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2)}
.lock{font-size:12.5px;background:var(--sky);color:#2d5b52;padding:8px 10px;border-radius:10px}
.emo{width:100%;height:100%;display:grid;place-items:center;font-size:84px}

/* farmer */
.two{display:grid;grid-template-columns:1.05fr .95fr;gap:22px;align-items:start}
.drop{display:block;border:2px dashed #c9bb9c;border-radius:var(--r);padding:30px;text-align:center;background:repeating-linear-gradient(45deg,transparent 0 12px,rgba(226,216,195,.25) 12px 24px);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--green2);background-color:var(--mint)}
.samples{display:flex;gap:10px;margin-top:14px}
.samples button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px;cursor:pointer}
.samples button:hover{border-color:var(--green2)}
.samples img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
.samples span{font-size:11.5px;color:var(--ink2)}
.scan{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3}
.scan img{width:100%;height:100%;object-fit:cover;display:block}
.scan .ln{position:absolute;left:0;right:0;height:3px;background:#7dff9e;box-shadow:0 0 18px 4px rgba(125,255,158,.7);top:0;animation:scan 1.6s ease-in-out infinite alternate}
.scan.done .ln{display:none}
@keyframes scan{to{top:calc(100% - 3px)}}
.scan .cn{position:absolute;width:26px;height:26px;border:3px solid #7dff9e}
.scan .cn.a{top:12px;right:12px;border-left:0;border-bottom:0}.scan .cn.b{top:12px;left:12px;border-right:0;border-bottom:0}
.scan .cn.c{bottom:12px;right:12px;border-left:0;border-top:0}.scan .cn.d{bottom:12px;left:12px;border-right:0;border-top:0}
.scan .lab{position:absolute;bottom:14px;right:50%;transform:translateX(50%);background:rgba(0,0,0,.65);color:#d8ffe2;font-size:13px;padding:6px 12px;border-radius:999px;white-space:nowrap}
.result{margin-top:16px}
.verdict{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px}
.verdict.cosmetic{background:var(--amberbg)}
.verdict.fresh{background:var(--mint)}
.verdict.spoiled{background:var(--tomatobg)}
.verdict .big{font-size:34px}
.verdict h3{font-size:19px}
.conf{height:8px;background:rgba(0,0,0,.08);border-radius:99px;overflow:hidden;margin-top:6px}
.conf i{display:block;height:100%;background:var(--green2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12.5px;background:#fff;border:1px solid var(--line);padding:3px 10px;border-radius:999px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.calc div{background:var(--bg);border-radius:12px;padding:10px 12px}
.calc b{display:block;font-family:"Readex Pro";font-size:18px;color:var(--green)}
.calc span{font-size:12px;color:var(--ink2)}
.src-note{font-size:11.5px;color:var(--muted);margin-top:10px}
.mine{display:flex;flex-direction:column;gap:10px}
.mi{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:#fff;text-decoration:none}
.mi img,.mi .emo{width:62px;height:62px;border-radius:10px;object-fit:cover;font-size:34px;background:var(--bg2);flex:none}
.mi .x{flex:1;min-width:0}
.mi .x b{display:block}

/* market */
.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:18px}
.toolbar .who{min-width:260px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13.5px}
.fchips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* detail */
.det{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:start}
.det .ph{border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;background:var(--bg2)}
.det .ph img{width:100%;height:100%;object-fit:cover}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}

/* impact */
.hbar{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.hbar.wide{grid-template-columns:140px 1fr 110px 150px}
@media (max-width:640px){.hbar.wide{grid-template-columns:100px 1fr 90px}.hbar.wide>span:last-child{display:none}}
.hbar .t{height:22px;background:var(--bg2);border-radius:6px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--green2);border-radius:6px}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{text-align:right;font-weight:600;color:var(--ink2);font-size:12.5px;padding:8px;border-bottom:1px solid var(--line)}
.tb td{padding:10px 8px;border-bottom:1px solid var(--line)}

/* certificate */
.cert{max-width:860px;margin:0 auto;background:#fffdf7;border-radius:8px;padding:12px;box-shadow:0 30px 60px -30px rgba(21,38,29,.45)}
.cert .in{border:2px solid var(--green);border-radius:4px;padding:36px 40px;position:relative;background:
  radial-gradient(circle at 0 0,rgba(134,184,90,.12),transparent 30%),radial-gradient(circle at 100% 100%,rgba(217,147,42,.1),transparent 30%)}
.cert .in::after{content:"";position:absolute;inset:6px;border:1px solid rgba(29,90,60,.35);pointer-events:none}
.cert h1{font-size:30px;color:var(--green);text-align:center;margin:14px 0 4px}
.cert .sub{text-align:center;color:var(--ink2)}
.cert .who{text-align:center;font-family:"Readex Pro";font-size:26px;font-weight:600;margin:18px 0 6px}
.cert .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}
.cert .nums div{text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.cert .nums b{display:block;font-family:"Readex Pro";font-size:26px;color:var(--green)}
.cert .foot{display:flex;justify-content:space-between;align-items:end;gap:20px;font-size:13px;color:var(--ink2)}
#qr canvas,#qr img{width:110px;height:110px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(21,38,29,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:20px;max-width:460px;width:100%;padding:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);max-height:90vh;overflow:auto}
.modal h3{font-size:20px;margin-bottom:12px}
.sum{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:15px;margin:14px 0}
.sum .tot{font-family:"Readex Pro";font-size:22px;font-weight:700;color:var(--green)}
#toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%) translateY(120px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:60;transition:.3s;max-width:90vw;font-size:14.5px}
#toast.on{transform:translateX(50%) translateY(0);opacity:1}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:13px}
footer .row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:900px){
  .hero,.two,.det,.v2030{grid-template-columns:1fr}
  .kpis,.steps{grid-template-columns:1fr 1fr}.aud{grid-template-columns:1fr}
  .problem{grid-template-columns:1fr}
  .top .row{flex-wrap:wrap;height:auto;padding:10px 0;gap:10px}
  nav.main{order:3;flex:1 1 100%;overflow-x:auto;padding-bottom:2px}
  .top .row>.pill{margin-inline-start:auto}
  .cert .nums{grid-template-columns:1fr}
  .cert .in{padding:24px 18px}
}
@media (max-width:520px){#sync span:last-child{display:none}.btn.dlapp{padding:8px 12px;font-size:13px}.kpis,.steps,.aud,.calc,.fgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="container row">
    <a class="brand" href="#home" aria-label="وفرة">
      <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#1d5a3c"/><path d="M11 25c0-8 6-14 18-15-1 11-7 17-15 17-1 0-2 0-3-.5" fill="#86b85a"/><path d="M12 28c3-5 7-9 12-12" stroke="#1d5a3c" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <span><b>وفرة</b><small>WAFRA</small></span>
    </a>
    <nav class="main" id="nav">
      <a href="#home" data-r="home">الرئيسية</a>
      <a href="#farmer" data-r="farmer">بوابة المزارع</a>
      <a href="#market" data-r="market">سوق الإنقاذ</a>
      <a href="#impact" data-r="impact">لوحة الأثر</a>
    </nav>
    <span class="pill" id="sync" title=""><span class="dot"></span><span>جارٍ الاتصال…</span></span>
    <button type="button" class="btn btn-primary dlapp" aria-label="تحميل وفرة"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span>تحميل وفرة</span></button>
  </div>
</header>

<main><div class="container" id="app"></div></main>

<footer>
  <div class="container row">
    <div>فريق <b>وفرة</b> · هاكاثون الأمن الغذائي والاستدامة البيئية · نموذج أولي</div>
    <div id="tools"></div>

function km(a,b){const R=6371,t=x=>x*Math.PI/180;const dLa=t(b.lat-a.lat),dLo=t(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function endAt(l){return l.startAt + l.durationMin*60000}
function sug(l){ return +(l.suggested ?? (l.market*SUGGEST_RATIO)).toFixed(2) }

function pend(l){ return (l.offers||[]).filter(o=>o.status==='pending') }
function nOff(n){ return n===0?'لا عروض':n===1?'عرض واحد':n===2?'عرضان':n<=10?`${n} عروض`:`${n} عرضاً` }
function best(l){ const p=pend(l); return p.length?Math.max(...p.map(o=>+o.price)):0 }
function mine(l,bid){ return pend(l).find(o=>o.buyerId===bid) }
function tag(l,o){ const ids=[...(l.offers||[])].sort((a,b)=>(a.since||a.at)-(b.since||b.at)).map(x=>x.buyerId).filter((v,i,a)=>a.indexOf(v)===i); return 'مشترٍ #'+(ids.indexOf(o.buyerId)+1) }
// open: taking offers · review: window closed, farmer still choosing · sold · expired: closed with no offers
function state(l, now=Date.now()){ if(l.status==='sold') return 'sold'; if(now<endAt(l)) return 'open'; return pend(l).length?'review':'expired'; }
function mmss(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return (m>=60?Math.floor(m/60)+':'+String(m%60).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')}
function ago(t){const m=Math.round((Date.now()-t)/60000);if(m<1)return'الآن';if(m<60)return`قبل ${m} د`;const h=Math.round(m/60);if(h<24)return`قبل ${h} س`;return`قبل ${Math.round(h/24)} يوم`}

/* ---------- data store: shared db when available, local demo otherwise ---------- */
const Store = {
  mode:'connecting', db:null, unsub:null, items:new Map(), canWrite:true,
  list(){return [...this.items.values()]},
  loadLocal(){
    let arr=null; try{arr=JSON.parse(localStorage.getItem('wafra.local')||'null')}catch(e){}
    if(!Array.isArray(arr)||!arr.length) arr=SEED();
    this.items=new Map(arr.map(l=>[l.id,l]));
  },
  saveLocal(){try{localStorage.setItem('wafra.local',JSON.stringify(this.list()))}catch(e){}},
  goLocal(reason){
    if(this.unsub){try{this.unsub()}catch(e){} this.unsub=null}
    const had=this.mode==='live'?this.list():null;
    this.mode='demo';
    if(had&&had.length){this.items=new Map(had.map(l=>[l.id,l]))} else this.loadLocal();
    onData();
  },
  async put(l){
    if(this.mode==='live'){
      try{ await this.db.collection('listings').doc(l.id).set(l); return; }
      catch(e){ if(e&&e.code==='invalid_argument'){ this.canWrite=false; this.goLocal(); toast('ليس لديك صلاحية الكتابة في السوق المشترك — تم الحفظ في وضع العرض المحلي'); } else throw e; }
    }
    this.items.set(l.id,l); this.saveLocal(); onData();
  },
  // write a change to one listing safely (lease so two people cannot change it at once)
  async mutate(id, fn){
    if(this.mode==='live'){
      const ref=this.db.collection('listings').doc(id);
      let lease; try{lease=await ref.acquire({holder:CLIENT,ttlMs:8000})}catch(e){lease={acquired:true}}
      if(!lease.acquired) throw {code:'busy'};
      const snap=await ref.get(); if(!snap.exists) throw {code:'gone'};
      const l={...snap.data(),id}; const patch=fn(l);
      try{ await ref.update(patch); return {...l,...patch}; }
      catch(e){ if(e&&e.code==='invalid_argument'){ this.canWrite=false; this.goLocal(); toast('ليس لديك صلاحية الكتابة في السوق المشترك — تم الحفظ في وضع العرض المحلي'); } else throw e; }
    }
    const l=this.items.get(id); if(!l) throw {code:'gone'};
    Object.assign(l,fn(l)); this.saveLocal(); onData(); return l;
  },
  offer(id, buyer, price){
    return this.mutate(id, l=>{
      if(state(l)!=='open') throw {code:'closed'};
      if(price<minP(l)) throw {code:'low'};
      const now=Date.now(), prev=(l.offers||[]).find(o=>o.buyerId===buyer.id);
      const others=(l.offers||[]).filter(o=>o.buyerId!==buyer.id);
      return {offers:[...others,{id:uid('o'),buyerId:buyer.id,buyerName:buyer.name,buyerType:buyer.typeAr,lat:buyer.lat,lng:buyer.lng,price:+(+price).toFixed(2),at:now,since:prev?.since||now,status:'pending'}]};
    });
  },
  accept(id, offerId){
    return this.mutate(id, l=>{
      const st=state(l); if(st==='sold') throw {code:'sold'};
      const o=(l.offers||[]).find(x=>x.id===offerId&&x.status==='pending'); if(!o) throw {code:'gone'};
      const now=Date.now();
      return {status:'sold',buyerId:o.buyerId,buyerName:o.buyerName,buyerType:o.buyerType,soldAt:now,soldPrice:+o.price,total:+(o.price*l.kg).toFixed(2),
        certNo:'WFR-'+new Date(now).getFullYear()+'-'+String(Math.floor(10000+Math.random()*89999)),
        offers:(l.offers||[]).map(x=>({...x,status:x.id===offerId?'accepted':(x.status==='pending'?'declined':x.status)}))};
    });
  },
  async resetDemo(){
    const seeds=SEED();
    if(this.mode==='live'){
      for(const l of this.list()){ await this.db.collection('listings').doc(l.id).delete(); }
      for(const l of seeds){ await this.db.collection('listings').doc(l.id).set(l); }
    } else { this.items=new Map(seeds.map(l=>[l.id,l])); this.saveLocal(); onData(); }
  }
};

const AI = {sample:null, images:false, ready:false};
let DL=null, USER=null;

async function initCaps(){
  if(!window.claude || typeof window.claude.use!=='function'){ Store.goLocal(); return; }
  const timer=setTimeout(()=>{ if(Store.mode==='connecting') Store.goLocal('timeout'); },11000);
  claude.use('sample').then(async s=>{ AI.sample=s; if(s){ try{const lim=await s.limits(); AI.images=!!(lim&&lim.images);}catch(e){AI.images=false} } AI.ready=true; onData(); }).catch(()=>{AI.ready=true});
  claude.use('downloads').then(d=>{DL=d; onData();}).catch(()=>{});
  claude.use('user').then(u=>{USER=u; onData();}).catch(()=>{});
  let db=null; try{ db=await claude.use('db'); }catch(e){}
  if(!db){ clearTimeout(timer); if(Store.mode==='connecting') Store.goLocal(); return; }
  Store.db=db;
  try{
    Store.unsub=db.collection('listings').onSnapshot(snap=>{
      clearTimeout(timer);
      const prev=Store.mode==='live'?Store.items:null;
      Store.items=new Map(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}]));
      Store.mode='live'; onData(); if(prev) notify(prev, Store.items);
    }, err=>{ clearTimeout(timer); Store.goLocal('error'); });
  }catch(e){ clearTimeout(timer); Store.goLocal(); }
}

/* ---------- AI grading ---------- */
const AI_PROMPT = `You are the quality-inspection model of "Wafra", a Saudi B2B platform that rescues produce rejected by supermarkets for cosmetic reasons.
Look at the photo of fruit or vegetables and grade it.

Grades:
- "cosmetic": edible and safe, but irregular shape, curvature, small or uneven size, color variation, healed scars or minor skin marks. Supermarkets reject it but juice factories and kitchens can use it.
- "fresh": meets normal retail standards, no notable defects.
- "spoiled": real damage that makes it unsafe: mold, rot, decay, leaking, deep open wounds, insects, heavy bruising.
If even part of the visible produce shows mold or rot, grade "spoiled".

crop must be one of: tomato, cucumber, carrot, pepper, orange, eggplant, potato, zucchini, onion, lemon, apple, mango, pomegranate, strawberry, dates, watermelon, other.

Reply with ONLY this JSON (Arabic text in the *_ar fields, short):
{"is_produce": true, "crop": "tomato", "grade": "cosmetic", "confidence": 0.92, "defects_ar": ["انحناء في الشكل"], "items_visible": 3, "note_ar": "جملة واحدة توضح سبب التصنيف"}
If the image does not show fruit or vegetables, set "is_produce": false.`;

async function toBlob(src, max=1280){
  const img=await loadImg(src);
  const sc=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
  const w=Math.round((img.naturalWidth||img.width)*sc)||800,h=Math.round((img.naturalHeight||img.height)*sc)||600;
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
  return {canvas:c, blob:await new Promise(r=>c.toBlob(r,'image/jpeg',.88))};
}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function thumb(src, max=420){
  const img=await loadImg(src);const W=img.naturalWidth||img.width||400,H=img.naturalHeight||img.height||300;
  const sc=Math.min(1,max/Math.max(W,H));const c=document.createElement('canvas');c.width=Math.round(W*sc);c.height=Math.round(H*sc);
  const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.72);
}
function localHeuristic(canvas){
  const c=document.createElement('canvas');c.width=96;c.height=72;const x=c.getContext('2d');x.drawImage(canvas,0,0,96,72);
  const d=x.getImageData(0,0,96,72).data;let n=0,rot=0;
  for(let i=0;i<d.length;i+=4){const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),v=mx,s=mx?(mx-mn)/mx:0;
    if(v>.88&&s<.15)continue; n++;
    let h=0;if(mx!==mn){if(mx===r)h=60*(((g-b)/(mx-mn))%6);else if(mx===g)h=60*((b-r)/(mx-mn)+2);else h=60*((r-g)/(mx-mn)+4)}if(h<0)h+=360;
    if(v<.22||(h>=15&&h<=45&&s>.35&&v<.42))rot++;}
  const ratio=n?rot/n:0;
  if(ratio>.12) return {grade:'spoiled',confidence:Math.min(.9,.6+ratio),defects:['بقع داكنة / تعفن محتمل'],note:'رُصدت مناطق داكنة واسعة تشير إلى تلف محتمل.'};
  return {grade:'cosmetic',confidence:.7,defects:['شكل أو حجم غير قياسي (تقدير)'],note:'لم تُرصد مؤشرات تلف واضحة؛ يُرجّح أن العيب شكلي.'};
}
async function analyze(src, sampleKey){
  const {canvas, blob}=await toBlob(src);
  for(let i=0;i<30&&!AI.ready&&window.claude;i++) await sleep(100);
  if(AI.sample && AI.images){
    try{
      const r=await AI.sample.json(AI_PROMPT,{images:[blob],modelTier:'quick'});
      if(r && r.is_produce===false) return {notProduce:true};
      const g=['cosmetic','fresh','spoiled'].includes(r&&r.grade)?r.grade:'cosmetic';
      return {source:'ai', grade:g, crop:PRICES[r.crop]?r.crop:(sampleKey?SAMPLES.find(s=>s.key===sampleKey).crop:'other'),
        confidence:Math.max(0,Math.min(1,Number(r.confidence)||.8)), defects:(Array.isArray(r.defects_ar)?r.defects_ar:[]).slice(0,4).map(String),
        items:Math.max(0,parseInt(r.items_visible)||0), note:String(r.note_ar||'')};
    }catch(e){
      if(['not_granted','sampling_disabled','not_declared','images_unavailable','capability_disabled','capability_removed'].includes(e&&e.code)) AI.sample=null;
      if(e&&e.code==='rate_limited') toast('تم بلوغ حد الطلبات مؤقتاً — استخدمنا التحليل المحلي');
    }
  }
  if(sampleKey){const s=SAMPLES.find(x=>x.key===sampleKey);await sleep(1400);return {source:'preset',crop:s.crop,...s.preset,defects:s.preset.defects}}
  await sleep(1200);
  return {source:'local',crop:S.draft?.crop||'tomato',items:0,...localHeuristic(canvas)};
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- live notifications (shared market only) ---------- */
function notify(prev, next){
  for(const [id,l] of next){
    const o=prev.get(id); if(!o) continue;
    // farmer: a new or raised offer on one of my listings
    if(S.role==='farmer' && l.farmId===S.farmId && l.status!=='sold'){
      const fresh=pend(l).filter(x=>!pend(o).some(y=>y.id===x.id));
      if(fresh.length){ const x=fresh.at(-1); toast(`عرض جديد على ${crop(l.crop).ar}: ${NF(x.price,2)} ر.س/كجم من ${tag(l,x)}`); }
    }
    // buyer: my offer was accepted, or the farmer chose someone else
    if(S.role!=='farmer' && o.status!=='sold' && l.status==='sold'){
      if(l.buyerId===S.buyerId){
        modal(`<div style="text-align:center">${BIG('check','#1d5a3c','#e3efdc')}<h3>قبل المزارع عرضك!</h3><p class="muted">${esc(crop(l.crop).ar)} — ${NF(l.kg)} كجم بسعر ${NF(l.soldPrice,2)} ر.س/كجم. أنقذتَ ${NF(l.kg)} كجم وتجنبتَ ${NF(l.kg*CO2_PER_KG)} كجم CO₂.</p>
          <div style="display:flex;gap:10px;justify-content:center;margin-top:14px"><a class="btn btn-primary" href="#cert-${id}" onclick="closeModal()">${I('award')} شهادة الاستدامة</a><button class="btn btn-ghost" onclick="closeModal()">إغلاق</button></div></div>`);
      } else if((o.offers||[]).some(x=>x.buyerId===S.buyerId&&x.status==='pending')){
        toast(`اختار المزارع عرضاً آخر على ${crop(l.crop).ar}`);
      }
    }
  }
}

/* ---------- metrics ---------- */
function metrics(){
  const sold=Store.list().filter(l=>l.status==='sold');
  const kg=sold.reduce((a,l)=>a+(+l.kg||0),0);
  const rev=sold.reduce((a,l)=>a+(+l.total||0),0);
  const save=sold.reduce((a,l)=>a+((+l.market||0)-(+l.soldPrice||0))*(+l.kg||0),0);
  const mins=sold.map(l=>(l.soldAt-l.startAt)/60000).filter(x=>x>=0);
  const avgMin=mins.length?mins.reduce((a,b)=>a+b,0)/mins.length:0;
  return {sold,kg,co2:kg*CO2_PER_KG,rev,save,deals:sold.length,avgMin,live:Store.list().filter(l=>state(l)==='open').length};
}

async function startFile(file){
  if(file.size>25e6){toast('الصورة كبيرة جداً');return}
  const src=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)});
  runDraft(src,null);
}
function startSample(key){ runDraft(svgURL(key), key); }
async function runDraft(src, sampleKey){
  S.draft={src, sampleKey, result:null, crop:sampleKey?SAMPLES.find(s=>s.key===sampleKey).crop:'tomato', kg:'', dur:120};
  const myDraft=S.draft; renderWork();
  let r; try{ r=await analyze(src, sampleKey); }catch(e){ r={source:'local',grade:'cosmetic',confidence:.6,defects:[],note:''}; }
  if(S.draft!==myDraft) return;
  myDraft.result=r; if(r.crop) myDraft.crop=r.crop;
  renderWork();
}
async function publish(){
  const d=S.draft; if(!d||!d.result) return; const kg=+d.kg; if(!(kg>=10)){toast('أدخل الكمية (10 كجم على الأقل)');return}
  const btn=$('#pub'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> جارٍ الطرح…';
  const f=FARMS.find(x=>x.id===S.farmId)||FARMS[0], p=crop(d.crop).p, now=Date.now();
  let photo=d.sampleKey?('svg:'+d.sampleKey):''; if(!photo){try{photo=await thumb(d.src)}catch(e){photo=''}}
  const l={id:uid('L'),crop:d.crop,kg,grade:d.result.grade,confidence:d.result.confidence,defects:d.result.defects||[],aiNote:d.result.note||'',aiSource:d.result.source,items:d.result.items||0,
    photo,farmId:f.id,farmName:f.name,city:f.city,lat:f.lat,lng:f.lng,market:p,suggested:+(p*SUGGEST_RATIO).toFixed(2),minPrice:+(p*MIN_RATIO).toFixed(2),
    startAt:now,durationMin:+d.dur||120,status:'live',offers:[],createdAt:now};
  try{ await Store.put(l); S.draft=null; renderWork(); renderDyn();
    modal(`<div style="text-align:center">${BIG('check','#1d5a3c','#e3efdc')}<h3>محصولك معروض الآن للمشترين!</h3><p class="muted">${crop(l.crop).e} ${NF(kg)} كجم ${esc(crop(l.crop).ar)} — ستظهر عروض أقرب المصانع والمطاعم في قائمة "عروضي" لحظياً، وتختار منها ما يناسبك.</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:14px"><button class="btn btn-primary" onclick="closeModal()">متابعة العروض</button></div></div>`);
  }catch(e){ toast('تعذر الطرح — حاول مرة أخرى'); btn.disabled=false; btn.innerHTML=I('send')+' اعرض للمشترين الآن'; }
}

function farmerDyn(){
  const mineL=Store.list().filter(l=>l.farmId===S.farmId).sort((a,b)=>b.startAt-a.startAt);
  if(Store.mode==='connecting') return `<div class="muted small">جارٍ التحميل…</div>`;
  if(!mineL.length) return `<div class="empty">لا توجد عروض بعد لهذه المزرعة.<br>ابدأ بتصوير محصولك.</div>`;
  const earned=mineL.filter(l=>l.status==='sold').reduce((a,l)=>a+(+l.total||0),0);
  const waiting=mineL.reduce((a,l)=>a+(l.status!=='sold'?pend(l).length:0),0);
  return `<div class="small" style="margin-bottom:10px">إجمالي الدخل من المحاصيل المنقذة: <b class="num" style="color:var(--green)">${NF(earned)} ر.س</b>${waiting?` · ${nOff(waiting)} بانتظار قرارك`:''}</div>
  <div class="mine">${mineL.slice(0,12).map(l=>{const s=state(l);return `<div class="fl card">
    <a class="mi" href="#l-${l.id}">${photoHTML(l)}<div class="x"><b>${crop(l.crop).e} ${esc(crop(l.crop).ar)} · <span class="num">${NF(l.kg)}</span> كجم</b>
    <div class="small muted">${s==='sold'?`بيع لـ${esc(l.buyerType||'مشترٍ')} بـ <span class="num">${NF(l.soldPrice,2)}</span> ر.س/كجم · <span class="num">${NF(l.total)}</span> ر.س`:s==='open'?`السعر المقترح <span class="num">${NF(sug(l),2)}</span> ر.س/كجم · تُغلق بعد <span class="num" data-c="${l.id}"></span>`:s==='review'?'انتهت مدة العروض — اختر عرضاً':'انتهت المدة دون عروض'}</div></div>
    ${stBadge(s)}</a>
    ${s==='open'||s==='review'?offerRows(l,true):''}
  </div>`}).join('')}</div>`;
}
function openAccept(lid, oid){
  const l=Store.items.get(lid); const o=l&&pend(l).find(x=>x.id===oid); if(!o){toast('هذا العرض لم يعد متاحاً');return}
  modal(`<h3>قبول عرض ${tag(l,o)}؟</h3>
    <div class="sum">
      <span>المحصول</span><b>${esc(crop(l.crop).ar)} — ${NF(l.kg)} كجم</b>
      <span>السعر</span><b class="num">${NF(o.price,2)} ر.س/كجم</b>
      <span>المسافة</span><b class="num">${NF(km(o,l))} كم</b>
      <span style="font-weight:600">دخلك من الصفقة</span><span class="tot num">${NF(o.price*l.kg)} ر.س</span>
    </div>
    <div class="small muted">ستُرفض بقية العروض تلقائياً ويُبلَّغ أصحابها. تُعرف جهة المشتري بعد القبول لتنسيق الاستلام.</div>
    <div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-primary btn-lg" id="cAcc" style="flex:1">تأكيد القبول</button><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button></div>`);
  $('#cAcc').onclick=async()=>{
    const b=$('#cAcc'); b.disabled=true; b.innerHTML='<span class="spin"></span> جارٍ التأكيد…';
    try{ const done=await Store.accept(lid,oid);
      modal(`<div style="text-align:center">${BIG('sprout','#1d5a3c','#e3efdc')}<h3>تمت الصفقة!</h3>
        <p class="muted">بعتَ ${NF(done.kg)} كجم بـ <b class="num">${NF(done.total)}</b> ر.س بدل إتلافها، وتجنّبتَ ${NF(done.kg*CO2_PER_KG)} كجم CO₂. المشتري: ${esc(done.buyerType||'')}.</p>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:14px"><a class="btn btn-primary" href="#cert-${lid}" onclick="closeModal()">${I('award')} شهادة الصفقة</a><button class="btn btn-ghost" onclick="closeModal()">إغلاق</button></div></div>`);
    }catch(e){ closeModal(); toast(e&&e.code==='busy'?'يجري تحديث العرض الآن — حاول بعد ثوانٍ':e&&e.code==='sold'?'تم بيع هذا المحصول بالفعل':'تعذر قبول العرض'); }
  };
}

function buyer(){return BUYERS.find(b=>b.id===S.buyerId)||BUYERS[0]}
function marketShell(){
  return `
  <div class="sec-h"><div><div class="eyebrow">سوق الإنقاذ</div><h2>محاصيل سليمة بأسعار مخفضة — قدّم عرضك</h2></div></div>
  <div class="toolbar">
    <div class="who"><label class="f">أشتري بصفتي</label><select class="inp" id="buyerSel">${BUYERS.map(b=>`<option value="${b.id}" ${b.id===S.buyerId?'selected':''}>${esc(b.name)} — ${esc(b.typeAr)} (${esc(b.city)})</option>`).join('')}</select></div>
    <div><label class="f">ترتيب</label><select class="inp" id="sortSel"><option value="near">الأقرب أولاً</option><option value="price">الأقل سعراً</option><option value="ending">يُغلق قريباً</option><option value="fresh">الأقل عروضاً</option></select></div>
    <div style="flex:1"><label class="f">المحصول</label><div class="fchips" id="fchips"></div></div>

function bindMarket(){
  $('#buyerSel').onchange=e=>{S.buyerId=e.target.value;pref.set('buyer',S.buyerId);renderDyn()};
  $('#sortSel').value=S.sort; $('#sortSel').onchange=e=>{S.sort=e.target.value;renderDyn()};
}
function marketDyn(){
  const B=buyer(), now=Date.now();
  const all=Store.list();
  const live=all.filter(l=>state(l,now)==='open');
  const crops=[...new Set(live.map(l=>l.crop))];
  const fc=$('#fchips'); if(fc){ fc.innerHTML=[['all','الكل']].concat(crops.map(k=>[k,crop(k).e+' '+crop(k).ar])).map(([k,t])=>`<button data-f="${k}" class="${S.filter===k?'on':''}">${t}</button>`).join(''); fc.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;renderDyn()}); }
  let rows=live.filter(l=>S.filter==='all'||l.crop===S.filter).map(l=>({l,d:km(B,l)}));
  if(S.sort==='near') rows.sort((a,b)=>a.d-b.d); else if(S.sort==='price') rows.sort((a,b)=>sug(a.l)-sug(b.l)); else if(S.sort==='fresh') rows.sort((a,b)=>pend(a.l).length-pend(b.l).length); else rows.sort((a,b)=>endAt(a.l)-endAt(b.l));
  const recent=all.filter(l=>l.status==='sold').sort((a,b)=>b.soldAt-a.soldAt).slice(0,6);
  if(Store.mode==='connecting') return `<div class="grid">${[1,2,3].map(()=>`<div class="card" style="height:330px;opacity:.5"></div>`).join('')}</div>`;
  return `
  ${rows.length?`<div class="grid">${rows.map(({l,d})=>card(l,d,B)).join('')}</div>`:`<div class="empty">لا توجد محاصيل تستقبل العروض الآن${S.filter!=='all'?' لهذا المحصول':''}.<br>عند طرح مزارع لمحصول جديد سيظهر هنا فوراً.</div>`}
  <section class="block"><div class="sec-h"><h2 style="font-size:20px">آخر الصفقات المكتملة</h2><span class="small muted">${I('lock')} هوية المشترين محمية</span></div>
  ${recent.length?`<div class="card" style="overflow:auto"><table class="tb"><thead><tr><th>المحصول</th><th>الكمية</th><th>نوع المشتري</th><th>السعر</th><th>CO₂ متجنب</th></tr></thead><tbody>
  ${recent.map(l=>`<tr><td>${crop(l.crop).e} ${esc(crop(l.crop).ar)}<div class="small muted">${esc(l.farmName)}</div></td><td class="num">${NF(l.kg)} كجم</td><td>${esc(l.buyerType||'مشترٍ')}<div class="small muted">${ago(l.soldAt)}</div></td><td class="num">${NF(l.soldPrice,2)} ر.س/كجم</td><td class="num">${NF(l.kg*CO2_PER_KG)} كجم</td></tr>`).join('')}
  </tbody></table></div>`:`<div class="empty">لا توجد صفقات بعد.</div>`}</section>`;
}
function offerBtn(l, big){
  const me=mine(l,S.buyerId);
  return me?`<button class="btn btn-ghost${big?' btn-lg':''}" style="width:100%" data-offer="${l.id}">${I('check')} عرضك <b class="num">${NF(me.price,2)}</b> · تعديل</button>`
           :`<button class="btn btn-amber${big?' btn-lg':''}" style="width:100%" data-offer="${l.id}">${I('send')} قدّم عرضك</button>`;
}
function card(l,d,B){
  const c=crop(l.crop), p=sug(l), n=pend(l).length, b=best(l);
  return `<div class="card lc">
    <a class="ph" href="#l-${l.id}">${photoHTML(l)}<div class="tl"><span class="badge b-cosmetic">${I('check')} ${GRADES[l.grade]?.short||'عيب شكلي'} · ${Math.round((l.confidence||0)*100)}%</span></div><div class="disc num" dir="ltr">-${Math.round((1-p/l.market)*100)}%</div></a>
    <div class="bd">
      <a href="#l-${l.id}" style="text-decoration:none"><h3>${c.e} ${esc(c.ar)} · <span class="num">${NF(l.kg)}</span> كجم</h3></a>
      <div class="meta"><span>${I('farm')} ${esc(l.farmName)}</span><span>${I('pin')} ${esc(l.city)} · <span class="num">${NF(d)}</span> كم</span></div>
      <div class="chips" style="margin:0">${(l.defects||[]).slice(0,2).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>
      <div class="price"><span class="small">السعر المقترح</span><span class="now num">${NF(p,2)}</span><span class="small">ر.س/كجم</span><span class="was num">${NF(l.market,2)}</span></div>
      <div class="obox">${n?`أعلى عرض <b class="num">${NF(b,2)}</b> ر.س/كجم · ${nOff(n)}`:'لا عروض بعد — كن أول من يقدّم عرضاً'}</div>
      <div class="bar"><i data-b="${l.id}" style="width:0"></i></div>
      <div class="cd"><span>${I('timer')} تُغلق العروض بعد <b class="num" data-c="${l.id}"></b></span><span>الحد الأدنى <span class="num">${NF(minP(l),2)}</span></span></div>
      <div style="margin-top:auto;padding-top:6px">${offerBtn(l)}</div>
    </div></div>`;
}
function bindCards(){
  document.querySelectorAll('[data-offer]').forEach(b=>b.onclick=()=>openOffer(b.dataset.offer));
  document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>{const [l,o]=b.dataset.accept.split('|');openAccept(l,o)});
}

function openOffer(id){
  const l=Store.items.get(id); if(!l||state(l)!=='open'){toast('انتهت مدة استقبال العروض لهذا المحصول');return}
  const B=buyer(), me=mine(l,B.id), b=best(l), lo=minP(l), hi=l.market;
  const r05=v=>Math.round(v*20)/20;
  let v=me?+me.price:Math.min(hi,Math.max(sug(l), b?r05(b+0.05):0));
  const quick=[['السعر المقترح',sug(l)],...(b?[['أعلى عرض + 0.05',Math.min(hi,r05(b+0.05))]]:[]),['الحد الأدنى',lo]];
  modal(`<h3>${me?'تعديل عرضك':'قدّم عرضك'}</h3>
    <div style="display:flex;gap:12px;align-items:center"><div style="width:70px;height:56px;border-radius:10px;overflow:hidden;flex:none">${photoHTML(l)}</div><div><b>${crop(l.crop).e} ${esc(crop(l.crop).ar)} — ${NF(l.kg)} كجم (الكمية كاملة)</b><div class="small muted">${esc(l.farmName)} · ${esc(l.city)} · ${nOff(pend(l).length)} حالياً${b?` · الأعلى ${NF(b,2)}`:''}</div></div></div>
    <label class="f" style="margin-top:16px">سعرك (ر.س/كجم)</label>
    <input class="inp num" id="oPrice" type="number" step="0.05" min="${lo}" max="${hi}" value="${v.toFixed(2)}" style="font-size:22px">
    <div class="fchips" style="margin-top:8px">${quick.map(([t,x])=>`<button type="button" data-q="${x}">${t} <span class="num">${NF(x,2)}</span></button>`).join('')}</div>
    <div class="sum" id="oSum"></div>
    <div class="small muted">${I('lock')} يرى المزارع عرضك باسم "${me?tag(l,me):'مشترٍ #'+(new Set((l.offers||[]).map(o=>o.buyerId)).size+1)}" دون اسم جهتك. يختار المزارع العرض الأنسب، وستصلك رسالة فور القبول.</div>
    <div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-primary btn-lg" id="cOff" style="flex:1">${me?'تحديث العرض':'إرسال العرض'}</button><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button></div>`);
  const inp=$('#oPrice'), sum=$('#oSum'), btn=$('#cOff');
  const upd=()=>{const x=+inp.value; const ok=x>=lo&&x<=hi;
    sum.innerHTML=`<span>إجمالي عرضك</span><span class="tot num">${ok?NF(x*l.kg):'—'} ر.س</span><span>توفيرك مقارنة بسعر الجملة</span><b class="num" style="color:var(--green2)">${ok?NF((hi-x)*l.kg):'—'} ر.س</b><span>CO₂ ستتجنبه إن قُبل</span><b class="num">${NF(l.kg*CO2_PER_KG)} كجم</b>${ok?'':`<span style="color:var(--tomato);grid-column:1/-1">السعر بين ${NF(lo,2)} و ${NF(hi,2)} ر.س/كجم</span>`}`;
    btn.disabled=!ok;};
  inp.oninput=upd; document.querySelectorAll('#mbox [data-q]').forEach(q=>q.onclick=()=>{inp.value=(+q.dataset.q).toFixed(2);upd()}); upd();
  btn.onclick=async()=>{
    btn.disabled=true; btn.innerHTML='<span class="spin"></span> جارٍ الإرسال…';
    try{ const done=await Store.offer(id,B,+inp.value); const o=mine(done,B.id);
      modal(`<div style="text-align:center">${BIG('send','#1d5a3c','#e3efdc')}<h3>${me?'تم تحديث عرضك':'تم إرسال عرضك'}</h3>
        <p class="muted">${NF(+inp.value,2)} ر.س/كجم على ${esc(crop(l.crop).ar)} (${NF(l.kg)} كجم). يظهر للمزارع باسم "${o?tag(done,o):'مشترٍ'}"، وستصلك رسالة فور قبوله.</p>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:14px"><a class="btn btn-primary" href="#l-${id}" onclick="closeModal()">متابعة العروض</a><button class="btn btn-ghost" onclick="closeModal()">إغلاق</button></div></div>`);
    }catch(e){
      closeModal(); toast(e&&e.code==='busy'?'يجري تحديث العرض الآن — حاول بعد ثوانٍ':e&&e.code==='closed'?'انتهت مدة استقبال العروض':e&&e.code==='low'?'السعر أقل من الحد الأدنى':'تعذر إرسال العرض');
    }
  };
}

/* ---------- IMPACT ---------- */
function impactDyn(){
  const m=metrics();
  const byCrop={}; m.sold.forEach(l=>byCrop[l.crop]=(byCrop[l.crop]||0)+(+l.kg||0));
  const cr=Object.entries(byCrop).sort((a,b)=>b[1]-a[1]); const mx=cr.length?cr[0][1]:1;
  return `
  <div class="sec-h"><div><div class="eyebrow">لوحة الأثر</div><h2>الأثر الاقتصادي والبيئي للمنصة</h2></div><span class="pill">${Store.mode==='live'?'● محدثة لحظياً':'بيانات العرض'}</span></div>
  <div class="kpis">
    <div class="card kpi"><div class="v num">${NF(m.kg)}</div><div class="l">كجم غذاء تم إنقاذها</div><div class="s">${m.deals} صفقة مكتملة</div></div>
    <div class="card kpi"><div class="v num">${NF(m.co2/1000,2)}</div><div class="l">طن CO₂e تم تجنبها</div><div class="s">${NF(m.co2)} كجم</div></div>
    <div class="card kpi"><div class="v num">${NF(m.rev)}</div><div class="l">ريال دخل جديد للمزارعين</div><div class="s">بدلاً من خسارة 100%</div></div>
    <div class="card kpi"><div class="v num">${NF(m.save)}</div><div class="l">ريال توفير للمشترين</div><div class="s">متوسط زمن البيع ${NF(m.avgMin)} دقيقة</div></div>
  </div>
  <div class="card pad" style="margin-top:22px"><div class="sec-h" style="margin-bottom:6px"><h3 style="font-size:18px">الكميات المنقذة حسب المحصول</h3><span class="small muted">الكمية (كجم) · CO₂e المتجنب (كجم)</span></div>
    ${cr.length?cr.map(([k,v])=>`<div class="hbar wide"><span>${crop(k).e} ${crop(k).ar}</span><div class="t"><i style="width:${(v/mx*100).toFixed(1)}%"></i></div><b class="num">${NF(v)} كجم</b><span class="num muted small">${NF(v*CO2_PER_KG)}</span></div>`).join(''):'<div class="empty">لا توجد بيانات بعد</div>'}
  </div>
  <div class="card pad" style="margin-top:22px"><h3 style="font-size:16px;margin-bottom:6px">${I('info')} منهجية الحساب</h3>
    <p class="small" style="margin:0;color:var(--ink2)">الانبعاثات المتجنبة = الكمية المنقذة × ${CO2_PER_KG} كجم CO₂e/كجم، وهو معامل مشتق من تقدير منظمة الأغذية والزراعة (FAO, 2013) للبصمة الكربونية لهدر الغذاء عالمياً (≈3.3 مليار طن CO₂e مقابل ≈1.3 مليار طن غذاء مهدر). أسعار الجملة المرجعية في النموذج الأولي استرشادية، وفي النسخة الإنتاجية تُربط بأسعار أسواق الجملة اليومية.</p></div>`;
}

/* ---------- CERTIFICATE ---------- */
function certDyn(){
  const l=Store.items.get(PARAM);
  if(!l) return Store.mode==='connecting'?`<div class="muted">جارٍ التحميل…</div>`:`<div class="empty">الشهادة غير موجودة.</div>`;
  if(l.status!=='sold') return `<div class="empty">لم تكتمل صفقة هذا العرض بعد. <a href="#l-${l.id}">عرض المحصول</a></div>`;
  const c=crop(l.crop), co2=l.kg*CO2_PER_KG, save=(l.market-l.soldPrice)*l.kg;
  return `<div style="display:flex;gap:10px;justify-content:center;margin-bottom:18px;flex-wrap:wrap">
      <button class="btn btn-primary" id="dlPdf" ${DL?'':'hidden'}>${I('download')} تحميل PDF</button>
      <button class="btn btn-ghost" id="dlPng" ${DL?'':'hidden'}>${I('image')} تحميل صورة</button>
      <button class="btn btn-ghost" id="cpNo">${I('copy')} نسخ رقم الشهادة</button>
    </div>
  <div class="cert"><div class="in">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="brand"><svg width="44" height="44" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#1d5a3c"/><path d="M11 25c0-8 6-14 18-15-1 11-7 17-15 17-1 0-2 0-3-.5" fill="#86b85a"/><path d="M12 28c3-5 7-9 12-12" stroke="#1d5a3c" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span><b>وفرة</b><small>WAFRA</small></span></div>
      <div class="small muted" style="text-align:left">رقم الشهادة<br><b class="num" style="color:var(--ink);font-size:15px">${esc(l.certNo)}</b></div>
    </div>
    <h1>شهادة إنقاذ غذاء واستدامة</h1>
    <div class="sub">تشهد منصة وفرة بأن</div>
    <div class="who">${esc(l.buyerName)}</div>
    <div class="sub">${esc(l.buyerType||'')} — أسهمت في إنقاذ محصول سليم مرفوض شكلياً من الهدر عبر شرائه من <b>${esc(l.farmName)}</b> (${esc(l.city)})</div>
    <div class="nums">
      <div><b class="num">${NF(l.kg)}</b>كجم ${esc(c.ar)} تم إنقاذها</div>
      <div><b class="num">${NF(co2)}</b>كجم CO₂e تم تجنبها</div>
      <div><b class="num">${NF(l.total)}</b>ريال عادت للمزارع</div>
    </div>
    <div class="foot">
      <div>تاريخ الصفقة: ${dateAr(l.soldAt)}<br>الموافق: ${hijri(l.soldAt)}<br>
        <span class="small">معامل الانبعاثات ${CO2_PER_KG} كجم CO₂e/كجم (FAO 2013) · متوافقة مع مستهدفات رؤية 2030 للحد من الفقد والهدر</span><br>
        <span class="small muted">صادرة عن منصة وفرة (نموذج أولي) وليست شهادة حكومية</span></div>
      <div id="qr" style="flex:none"></div>
    </div>
  </div></div>`;
}
function qrText(l){return `WAFRA-CERT|${l.certNo}|${l.kg}kg|CO2e ${Math.round(l.kg*CO2_PER_KG)}kg|${new Date(l.soldAt).toISOString().slice(0,10)}`}
function qrCanvas(text,size){ if(typeof qrcode!=='function') return null; const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);const s=size/(n+2);x.fillStyle='#15261d';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+1)*s,(r+1)*s,Math.ceil(s),Math.ceil(s));return c}
function bindCert(){
  const l=Store.items.get(PARAM); if(!l||l.status!=='sold') return;
  const q=qrCanvas(qrText(l),220); if(q) $('#qr').appendChild(q);
  $('#cpNo').onclick=async()=>{try{await navigator.clipboard.writeText(l.certNo);toast('تم نسخ رقم الشهادة')}catch(e){toast(l.certNo)}};
  const p=$('#dlPdf'), g=$('#dlPng');
  if(p) p.onclick=()=>downloadCert(l,'pdf'); if(g) g.onclick=()=>downloadCert(l,'png');
}
async function drawCert(l){
  try{await Promise.all([document.fonts.load('700 40px "Readex Pro"'),document.fonts.load('500 20px "IBM Plex Sans Arabic"'),document.fonts.load('400 20px "IBM Plex Sans Arabic"')])}catch(e){}
  const W=1754,H=1240,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fffdf7';x.fillRect(0,0,W,H);
  let g=x.createRadialGradient(0,0,0,0,0,700);g.addColorStop(0,'rgba(134,184,90,.18)');g.addColorStop(1,'rgba(134,184,90,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  g=x.createRadialGradient(W,H,0,W,H,700);g.addColorStop(0,'rgba(217,147,42,.15)');g.addColorStop(1,'rgba(217,147,42,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='#1d5a3c';x.lineWidth=6;x.strokeRect(40,40,W-80,H-80);x.lineWidth=2;x.globalAlpha=.4;x.strokeRect(58,58,W-116,H-116);x.globalAlpha=1;
  x.direction='rtl';x.textBaseline='alphabetic';
  const T=(t,px,y,font,col='#15261d',al='center')=>{x.font=font;x.fillStyle=col;x.textAlign=al;x.fillText(t,px,y)};
  // logo
  x.beginPath();x.arc(W-160,150,46,0,7);x.fillStyle='#1d5a3c';x.fill();
  x.save();x.translate(W-206,104);x.scale(2.3,2.3);x.fillStyle='#86b85a';x.fill(new Path2D('M11 25c0-8 6-14 18-15-1 11-7 17-15 17-1 0-2 0-3-.5'));x.restore();
  T('وفرة',W-230,168,'700 52px "Readex Pro"','#1d5a3c','right');
  T('رقم الشهادة',150,135,'400 24px "IBM Plex Sans Arabic"','#7c857c','left');
  x.direction='ltr';T(l.certNo,150,172,'700 30px "Readex Pro"','#15261d','left');x.direction='rtl';
  T('شهادة إنقاذ غذاء واستدامة',W/2,300,'700 64px "Readex Pro"','#1d5a3c');
  T('تشهد منصة وفرة بأن',W/2,370,'400 30px "IBM Plex Sans Arabic"','#4b5a50');
  T(l.buyerName,W/2,455,'600 58px "Readex Pro"');
  T(`${l.buyerType||''} — أسهمت في إنقاذ محصول سليم مرفوض شكلياً من الهدر`,W/2,520,'400 28px "IBM Plex Sans Arabic"','#4b5a50');
  T(`عبر شرائه من ${l.farmName} (${l.city})`,W/2,562,'400 28px "IBM Plex Sans Arabic"','#4b5a50');
  const boxes=[[NF(l.kg),`كجم ${crop(l.crop).ar} تم إنقاذها`],[NF(l.kg*CO2_PER_KG),'كجم CO₂e تم تجنبها'],[NF(l.total),'ريال عادت للمزارع']];
  const bw=440,bh=170,gap=50,sx=(W-(bw*3+gap*2))/2;
  boxes.forEach((b,i)=>{const bx=W-sx-bw-(bw+gap)*i;x.fillStyle='#fff';x.strokeStyle='#e2d8c3';x.lineWidth=2;x.beginPath();x.roundRect?x.roundRect(bx,630,bw,bh,20):x.rect(bx,630,bw,bh);x.fill();x.stroke();
    x.direction='ltr';T(b[0],bx+bw/2,715,'700 60px "Readex Pro"','#1d5a3c');x.direction='rtl';T(b[1],bx+bw/2,765,'500 26px "IBM Plex Sans Arabic"','#4b5a50')});
  T(`تاريخ الصفقة: ${dateAr(l.soldAt)}`,W-150,920,'500 28px "IBM Plex Sans Arabic"','#15261d','right');
  T(`الموافق: ${hijri(l.soldAt)}`,W-150,965,'400 26px "IBM Plex Sans Arabic"','#4b5a50','right');
  T(`معامل الانبعاثات ${CO2_PER_KG} كجم CO₂e لكل كجم (FAO 2013) · متوافقة مع مستهدفات رؤية 2030 للحد من الفقد والهدر`,W-150,1030,'400 22px "IBM Plex Sans Arabic"','#4b5a50','right');
  T('صادرة عن منصة وفرة (نموذج أولي) وليست شهادة حكومية',W-150,1070,'400 20px "IBM Plex Sans Arabic"','#7c857c','right');
  const q=qrCanvas(qrText(l),230); if(q) x.drawImage(q,140,870,230,230);
  return c;
}
async function downloadCert(l,kind){
  if(!DL){toast('التحميل غير متاح في هذا العرض');return}
  try{
    const c=await drawCert(l); let data, name=`Wafra-${l.certNo}.${kind}`;
    if(kind==='pdf'){
      if(!window.jspdf){toast('مكتبة PDF غير متاحة — جرّب تحميل الصورة');return}
      const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
      pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,297,210); data=pdf.output('blob');
    } else data=await new Promise(r=>c.toBlob(r,'image/png'));
    await DL.save({filename:name,data}); toast('تم حفظ الشهادة');
  }catch(e){ if(e&&e.code==='declined') return; toast('تعذر التحميل'); }
}

/* ---------- live ticking ---------- */
function tick(){
  const now=Date.now();
  document.querySelectorAll('[data-c]').forEach(el=>{const l=Store.items.get(el.dataset.c);if(l)el.textContent=mmss(endAt(l)-now)});
  document.querySelectorAll('[data-b]').forEach(el=>{const l=Store.items.get(el.dataset.b);if(l)el.style.width=(Math.min(1,(now-l.startAt)/(l.durationMin*60000))*100).toFixed(1)+'%'});
  // an offer window that just closed → refresh the view once
  if([...document.querySelectorAll('[data-c]')].some(el=>{const l=Store.items.get(el.dataset.c);return l&&state(l,now)!=='open'&&!el.dataset.ended&&(el.dataset.ended='1')})) renderDyn();
}
setInterval(tick,1000);

renderSync(); route(); initCaps();
</script>
